name: Browser tests

# The Playwright tests against a deployed app, on demand: they change data (requests, approvals),
# so they don't run on every push. The demo starts over every night anyway.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Address of the app to test
        required: true
        default: https://lendloop-demo-five.vercel.app

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
